# =====================================================================
# ETF Confluence Scanner - Configuration File
# =====================================================================

data:
  tickers_file: "tickers.csv"
  period: "400d"
  interval: "1d"
  batch_size: 50

# Filtr płynności (Liquidity Filter)
liquidity_filter:
  min_volume_sma_20: 50000    # ZMIANA z 5000: Odrzucenie niepłynnych spółek o szerokim spreadzie
  min_dollar_volume: 1000000  # Minimum 1 mln USD/EUR średniego obrotu dziennego (Cena * Wolumen)

# Parametry wskaźników technicznych
indicators:
  bollinger_bands:
    window: 20
    num_std: 2.0
  rsi:
    window: 14
    oversold_level: 35.0      # Kryterium 1: RSI < 35
    rebound_level: 30.0       # Kryterium 1: powrót ponad 30
    rebound_lookback: 2       # sesje wstecz do wykrycia przecięcia poziomu 30
  macd:
    fast: 12
    slow: 26
    signal: 9
  moving_averages:
    ema_short: 9
    sma_medium: 20
    sma_long: 200
  rvol:
    window: 20
    absorption_threshold: 1.4  # Kryterium 4: RVol >= 1.4x średniej
  fibonacci:
    lookback_window: 60       # Swing High/Low z ostatnich 60 sesji
    margin_pct: 0.01          # Margines +/- 1% wokół strefy Fibo
    key_levels:
      - 0.382
      - 0.500
      - 0.618

# Matryca konfluencji (Scoring)
scoring:
  min_criteria_required: 3    # Wymagane minimum 3 z 5 kryteriów

# Zarządzanie ryzykiem i Twarde Filtry Strukturalne (z wniosków z backtest.py)
risk_management:
  sl_buffer_pct: 0.005
  min_rr_tp1_warning: 1.0
  # NOWE TWARDE FILTRY (Hard Cutoffs - odrzucają setup zamiast tylko ostrzegać):
  require_uptrend_sma200: false   # Ustaw true jeśli chcesz TYLKO hossę (>SMA200), lub false z filtrem R:R
  max_candle_change_pct: 4.0      # Anti-Chasing: Odrzuć przegrzane świece > +4.0% (wycina SGI +7.4% i SYRE +8.1%)
  max_sl_distance_pct: 6.5        # Ochrona kapitału: Odrzuć setupy z SL szerszym niż -6.5% (wycina FRHC -11.3% i SYRE -8.9%)
  min_rr_to_tp1: 0.75             # Minimum R:R do pierwszego oporu (SMA20) >= 0.75 (wycina BIO 0.27 i SGI 0.25!)
  min_rr_to_tp2: 1.50             # Minimum R:R do głównego celu (TP2) >= 1.50 (wycina SYRE 1.02!)
# Konfiguracja powiadomień Telegram
telegram:
  enabled: true
  token_env_var: "TELEGRAM_BOT_TOKEN"
  chat_id_env_var: "TELEGRAM_CHAT_ID"
  request_timeout: 10
  max_retries: 3
  # Gdy dry_run=true, powiadomienia są logowane do konsoli zamiast wysyłania HTTP
  dry_run: false

# Logowanie
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
