# =====================================================================
# ETF Confluence Scanner - Configuration File
# =====================================================================

data:
  tickers_file: "tickers.csv"
  period: "2y"
  interval: "1d"
  batch_size: 50

# Filtr płynności (Liquidity Filter) - adaptacyjny pod specyfikę akcji i ETF-ów
liquidity_filter:
  min_volume_sma_20: 30000    # Standardowy próg dla akcji (US/Global)
  min_dollar_volume: 1000000  # Minimum 1 mln USD/EUR dziennego obrotu dla akcji
  # Specyfika europejskich funduszy ETF UCITS (XETRA, LSE) - animacja przez AP / wysoka cena jednostkowa
  etfs_europe:
    min_volume_sma_20: 3000    # Dla funduszy ETF wystarczy 3 000 jednostek przy wysokiej cenie
    min_dollar_volume: 250000  # Minimum 250 tys. EUR obrotu w arkuszu giełdowym

# Parametry wskaźników technicznych
indicators:
  bollinger_bands:
    window: 20
    num_std: 2.0
  rsi:
    window: 14
    oversold_level: 35.0      # Kryterium 1: RSI < 35
    rebound_level: 30.0       # Kryterium 1: powrót ponad 30
    rebound_lookback: 2       # sesje wstecz do wykrycia przecięcia poziomu 30
  macd:
    fast: 12
    slow: 26
    signal: 9
  moving_averages:
    ema_short: 9
    sma_medium: 20
    sma_long: 200
  rvol:
    window: 20
    absorption_threshold: 1.4  # Kryterium 4: RVol >= 1.4x średniej
  fibonacci:
    lookback_window: 60       # Swing High/Low z ostatnich 60 sesji
    margin_pct: 0.01          # Margines +/- 1% wokół strefy Fibo
    key_levels:
      - 0.382
      - 0.500
      - 0.618

# Matryca konfluencji (Scoring)
scoring:
  min_criteria_required: 3    # Wymagane minimum 3 z 5 kryteriów

# Zarządzanie ryzykiem i Twarde Filtry Strukturalne (z wniosków z backtest.py)
risk_management:
  use_atr_sl: true               # Stop Loss oparty o zmienność (2.0 * ATR_14) zamiast ciasnego dołka świecy
  atr_sl_multiplier: 2.0
  sl_buffer_pct: 0.005
  min_rr_tp1_warning: 1.0
  # TWARDE FILTRY (Hard Cutoffs):
  require_uptrend_sma200: true   # Tylko hossa (>SMA200)
  max_candle_change_pct: 3.0     # Zakaz gonienia świec > 3.0%
  max_sl_distance_pct: 8.5       # Dostosowane pod 2.0 * ATR_14 na zmiennych spółkach
  min_rr_to_tp1: 0.60            # Przy szerszym SL (2x ATR) TP1 @ SMA20 może być bliżej (0.60R+)
  min_rr_to_tp2: 1.40            # Cel końcowy TP2 musi dawać min. 1.40R
# Konfiguracja powiadomień Telegram
telegram:
  enabled: true
  token_env_var: "TELEGRAM_BOT_TOKEN"
  chat_id_env_var: "TELEGRAM_CHAT_ID"
  request_timeout: 10
  max_retries: 3
  # Gdy dry_run=true, powiadomienia są logowane do konsoli zamiast wysyłania HTTP
  dry_run: false

# Logowanie
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
