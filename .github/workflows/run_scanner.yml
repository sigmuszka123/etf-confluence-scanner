name: ETF Confluence Scanner

on:
  schedule:
    - cron: '10 21 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Uruchom w trybie testowym DRY-RUN (bez wysyłania na Telegram)'
        required: false
        default: 'false'
        type: boolean
      test_alert:
        description: 'Wyślij próbny alert testowy'
        required: false
        default: 'false'
        type: boolean

jobs:
  run-scanner:
    name: Execute Daily ETF Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETF Confluence Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ github.event.inputs.test_alert }}" = "true" ]; then
            FLAGS="$FLAGS --test-alert"
          fi
          python main.py $FLAGS
